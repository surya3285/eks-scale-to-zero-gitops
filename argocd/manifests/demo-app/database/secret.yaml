# Plaintext Secret is a deliberate demo simplification (still base64-at-rest
# in etcd, not visible in plain YAML diffs to casual readers of the repo).
# In a real environment, use External Secrets Operator or Sealed Secrets
# instead of committing credentials -- even placeholder ones -- to git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: demo-app
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo-password-change-me
  POSTGRES_DB: demo
  PGRST_DB_URI: postgres://demo:demo-password-change-me@database:5432/demo
