apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: demo-app
  annotations:
    # Sync waves make Argo wait for this to be Healthy before it even
    # creates the backend/frontend resources -- avoids a startup thundering
    # herd against a not-yet-ready database every morning after scale-up.
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: database
  # replicas intentionally omitted -- see argocd/apps/demo-app.yaml
  # ignoreDifferences. The scale-up/scale-down CronJobs own this field.
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: workload
          effect: NoSchedule
      nodeSelector:
        role: workload
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "demo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "demo"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
