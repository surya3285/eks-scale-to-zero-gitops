apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # replicas intentionally omitted -- see argocd/apps/demo-app.yaml
  # ignoreDifferences. The scale-up/scale-down CronJobs own this field.
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: workload
          effect: NoSchedule
      nodeSelector:
        role: workload
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
        - name: html
          configMap:
            name: frontend-html
